<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbeitskunde – Demoversion</title>
</head>
<body>



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap">
<style id="app-style">
/* Layout: helle Glasflächen über diffusen Farbflächen in Uni-Grün und BS1-Blau/-Rot; Blöcke farbcodiert nach Aderfarben (L1 braun, L2 schwarz, L3 grau, N blau, PE grün-gelb). Bewusst nur ein helles Erscheinungsbild. */
:root{
  color-scheme:light;
  --bg:#f5f7f9; --surface:rgba(255,255,255,.62); --surface-strong:rgba(255,255,255,.86); --surface-2:rgba(236,241,245,.75);
  --fg:#15202b; --muted:#5b6773; --line:rgba(21,40,62,.11); --glass-edge:rgba(255,255,255,.75);
  --uni-base:#009260; --school-base:#1a3170; --school-red:#7e2116;
  --uni:var(--uni-base); --accent:color-mix(in srgb, var(--uni-base) 78%, #000); --accent-ink:#ffffff; --accent-soft:color-mix(in srgb, var(--uni-base) 12%, rgba(255,255,255,.7));
  --school:var(--school-base); --school-soft:color-mix(in srgb, var(--school-base) 8%, rgba(255,255,255,.7)); --school-ink:#ffffff;
  --warn:#8f5400; --warn-soft:rgba(251,236,210,.8); --ok:#2b6b2f; --ok-soft:rgba(223,240,218,.85); --idea:#5f4f86; --idea-soft:rgba(234,229,244,.85);
  --bad:#7e2116; --bad-soft:rgba(249,226,222,.85);
  --w1:#7a4a2a; --w2:#262626; --w3:#8a8f8c; --w4:#2a62b0; --w5a:#3f8f3a; --w5b:#e2c21c;
  --f-display:"Helvetica Neue Condensed","HelveticaNeue-CondensedBold","Helvetica Neue","Roboto Condensed",Helvetica,Arial,sans-serif;
  --f-body:"Helvetica Neue","HelveticaNeue",Helvetica,Arial,sans-serif;
  --f-mono:"Helvetica Neue","HelveticaNeue-Light","Roboto Condensed",Helvetica,Arial,sans-serif;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 1px rgba(21,40,62,.04), 0 10px 30px rgba(21,40,62,.07);
  --blur:blur(22px) saturate(170%);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(circle at 8% 12%, rgba(174,226,200,.55) 0, rgba(174,226,200,0) 22%),
 radial-gradient(circle at 88% 8%, rgba(255,205,221,.5) 0, rgba(255,205,221,0) 20%),
 radial-gradient(circle at 70% 38%, rgba(214,204,255,.38) 0, rgba(214,204,255,0) 18%),
 radial-gradient(circle at 22% 62%, rgba(255,232,196,.5) 0, rgba(255,232,196,0) 19%),
 radial-gradient(circle at 94% 72%, rgba(196,228,255,.5) 0, rgba(196,228,255,0) 21%),
 radial-gradient(circle at 48% 96%, rgba(255,243,184,.45) 0, rgba(255,243,184,0) 20%),
 radial-gradient(circle at 4% 94%, rgba(201,240,220,.5) 0, rgba(201,240,220,0) 18%),
 var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Markenleiste Uni + Schule */
.brandbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:12px}
.brandbar span{display:inline-flex;align-items:center;gap:7px}
.brandbar i{width:26px;height:8px;border-radius:2px;display:inline-block}
.brandbar .u i{background:var(--uni)} .brandbar .s i{background:var(--school)}
/* Kopf */
header.top{display:grid;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top-row>div{min-width:0}
.motto{font-family:var(--f-display);font-size:1.12rem;font-weight:500;max-width:62ch;color:var(--fg)}
.motto b{color:var(--accent);font-weight:700}
.meta-line{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.92rem}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill.edit{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:#b3261e;border-color:#b3261e55}
.btn.sm{padding:4px 10px;font-size:.84rem}

/* Reiter */
nav.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner.info{background:var(--accent-soft)}

/* Werkzeugleiste */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.toolbar select{padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}

/* Blocklegende */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 18px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wire{display:inline-block;width:22px;height:6px;border-radius:3px;flex:none}
.b1{--wc:var(--w1)} .b2{--wc:var(--w2)} .b3{--wc:var(--w3)} .b4{--wc:var(--w4)}
.wire{background:var(--wc)}
.b5 .wire,.wire.b5{background:repeating-linear-gradient(90deg,var(--w5a) 0 6px,var(--w5b) 6px 12px)}

/* Termine */
.plan{display:grid;gap:10px}
.sess{display:grid;grid-template-columns:6px 86px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess .stripe{background:var(--wc)}
.sess.b5 .stripe{background:repeating-linear-gradient(180deg,var(--w5a) 0 10px,var(--w5b) 10px 20px)}
.sess .when{padding:14px 10px 14px 14px;display:grid;align-content:start;gap:2px;border-right:1px solid var(--line)}
.sess .num{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1}
.sess .date{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.sess .body{padding:12px 16px 14px;min-width:0;display:grid;gap:8px}
.sess-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sess-head>div{min-width:0;flex:1 1 280px}
.sess-head .lead{font-size:.88rem;color:var(--muted)}
.topics{margin:0;padding-left:1.1em;color:var(--fg)}
.topics li{margin:1px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.status{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.st-idee{background:var(--idea-soft);color:var(--idea)}
.st-entwurf{background:var(--warn-soft);color:var(--warn)}
.st-fertig{background:var(--ok-soft);color:var(--ok)}
.hiddenflag{font-size:.75rem;color:var(--muted);border:1px dashed var(--line);padding:1px 7px;border-radius:4px}
details.more>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 22px;margin-top:12px}
.detail-grid>div{min-width:0}
.detail-grid .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.detail-grid .txt{white-space:pre-line;font-size:.95rem}
.team-task{background:var(--accent-soft);border-radius:6px;padding:10px 12px}
.team-task .lbl{color:var(--accent)}
.sess-actions{display:flex;gap:4px;flex-wrap:wrap}
.break{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--f-mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
.break::before,.break::after{content:"";flex:1;height:1px;background:var(--line)}
.placeholder{color:var(--muted);font-style:italic}

/* Fälle */
.class-head{display:grid;gap:6px;margin:22px 0 16px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.case-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.case .tag{font-size:.8rem;font-weight:700;color:var(--accent)}
.case dl{margin:0;display:grid;gap:6px}
.case dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.case dd{margin:0;font-size:.94rem;white-space:pre-line}
.case.flash{outline:2px solid var(--accent)}
.fmt{color:var(--accent);font-weight:600}
.upd{border:1px solid color-mix(in srgb, var(--school) 35%, transparent);border-left:4px solid var(--school);background:var(--school-soft);border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.upd.missing{border-style:dashed;border-left-width:1px;background:transparent;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.9rem}
.upd-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upd-type{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px;background:var(--school);color:var(--school-ink)}
.upd-title{font-weight:600}
.popup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:min(520px,calc(100% - 32px));display:grid;gap:10px;padding:24px;border-radius:24px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(21,40,62,.25);animation:pop .35s ease}
.popup h2{font-size:1.3rem}
.popup-btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--school-red);margin-left:6px;vertical-align:middle}
.w-pass{display:grid;gap:6px;justify-items:center}
.w-pass input{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.85)}
.savebar small{opacity:.8}
.cat{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;margin-top:2px}
.cat-normal{background:rgba(27,127,69,.1);color:#1b6b3d}
.cat-foerder{background:rgba(126,33,22,.08);color:var(--school-red)}
.sel{padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.upd-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.avs{display:inline-flex}
.avs .av{border-radius:50%;border:2px solid var(--surface);margin-right:-6px}
.updline{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.updline:hover{border-color:var(--school)}
.book{display:grid;gap:10px}
.bookitem{display:grid;grid-template-columns:110px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--school);border-radius:var(--r);padding:14px 16px}
.bk-date{display:grid;align-content:start;gap:2px;font-size:.88rem}
@media (max-width:560px){.bookitem{grid-template-columns:1fr}}
.seat-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.seat-bar .field{flex:1 1 220px}
.seat-bar select{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.seat-reason{font-size:.92rem;margin:4px 0 10px;max-width:80ch}
.seat-save{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.room{border:2px solid var(--school);border-radius:10px;background:var(--surface);padding:14px;overflow-x:auto}
.room-front{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;min-width:640px}
.board{flex:1;text-align:center;background:var(--school);color:var(--school-ink);border-radius:4px;padding:6px;font-size:.8rem;font-weight:600;letter-spacing:.04em}
.desk-t{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:10px 14px;font-size:.8rem;color:var(--muted)}
.room-body{display:grid;grid-template-columns:auto 1fr auto;gap:10px;min-width:640px}
.window,.door{writing-mode:vertical-rl;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 3px;text-align:center}
.door{align-self:end;height:80px}
.rows{display:grid;gap:18px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.desk{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:6px;padding:5px}
.seat{display:grid;justify-items:center;gap:3px;padding:7px 4px;border-radius:6px;border:2px solid transparent;background:var(--surface);min-height:84px;font-size:.82rem;cursor:grab}
.seat .av{border-radius:50%}
.seat-n{font-weight:600;line-height:1.1}
.seat-t{font-size:.66rem;color:var(--muted);line-height:1.15;text-align:center}
.seat.empty{color:var(--muted);border:2px dashed var(--line);align-content:center;cursor:pointer;background:transparent}
.seat.sel,.chip.sel{outline:3px solid var(--accent);outline-offset:1px}
.seat.so-beliebt{border:3px solid #1b7f45!important;background:#eaf6ee}
.seat.so-abgelehnt{border:3px solid #c0262d!important;background:#fcebec}
.seat.so-vernachlaessigt{border:3px dashed #6f7a86!important;background:#f1f3f5}
.seat.so-kontrovers{border:3px solid #7a3fb0!important;background:#f3ecfa}
.seat.so-durchschnittlich{border:2px solid rgba(21,40,62,.18)!important}
.so-badge{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1;color:#fff;font-style:normal}
.b-beliebt{background:#1b7f45} .b-abgelehnt{background:#c0262d} .b-vernachlaessigt{background:#6f7a86} .b-kontrovers{background:#7a3fb0}
.lg{display:none}
.legend .so-badge{position:static;display:inline-grid}
.lg-avg{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(21,40,62,.25)}
.tray{margin-top:14px;display:grid;gap:6px}
.tray .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.av{display:inline-block;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2);object-fit:cover;vertical-align:middle}
.av svg{width:100%;height:100%;display:block}
.chip-av{display:inline-flex;align-items:center;gap:6px;padding-left:3px}
.chip-av .av{border-radius:50%}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.student{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;grid-template-rows:auto 1fr auto;min-width:0}
.st-top{display:flex;gap:12px;align-items:center}
.st-top h3{font-size:1rem}
.st-meta{font-size:.78rem;margin:2px 0}
.tag{font-size:.8rem;font-weight:700;color:var(--accent)}
.teaser{font-size:.92rem;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;gap:0}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:var(--r) 0 0 var(--r)}
.seg .btn:last-child{border-radius:0 var(--r) var(--r) 0;margin-left:-1px}
.seg .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.clist{border-collapse:collapse;width:100%;font-size:.9rem;min-width:860px}
.clist th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);font-weight:500}
.clist td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.clist tr:last-child td{border-bottom:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.akte .form section{display:grid;gap:6px}
.akte .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.akte .txt{white-space:pre-line}
.akte-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.akte-head .av{border-radius:16px}
.facts{margin:6px 0 0;display:grid;gap:6px}
.facts dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-size:.93rem}
.idea input,.idea textarea,.idea select{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.idea select{width:auto}
.idea input{font-weight:700}
.st-i-eingeplant{border-color:var(--ok)}
.st-i-verworfen{opacity:.6}

.krit-note{display:grid;gap:2px;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:10px 12px;border-radius:12px;border:1px solid rgba(200,16,46,.3);background:rgba(252,222,226,.55)}
.krit-note b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#a50e26}
.krit-note span{font-size:.9rem}
.sess-lock{margin:4px 0 0;font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.prep-note{margin-top:4px;padding:10px 12px;border-radius:12px;background:rgba(0,146,96,.06);display:grid;gap:4px}
.team-task.locked{opacity:.8}
.wahl-chart{display:grid;gap:8px;margin:6px 0 2px}
.wc-row{display:grid;grid-template-columns:30px minmax(90px,150px) 1fr 28px;gap:10px;align-items:center}
.wc-name{display:grid;font-weight:600;font-size:.92rem;line-height:1.15}
.wc-name em{font-style:normal;font-weight:500;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.wc-bar{height:12px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden}
.wc-bar i{display:block;height:100%;border-radius:999px;background:rgba(26,49,112,.35)}
.wc-win .wc-bar i{background:var(--uni)}
.wc-n{text-align:right;font-variant-numeric:tabular-nums}

.sg-main{display:grid;gap:6px;align-content:start;min-width:0}
.sg-sidepanel{display:grid;gap:10px;align-content:start}

.sg-pop-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Ticker */

/* Export */

@media (max-width:560px){

}

/* ---------- Glas ---------- */

.seg .btn{border-radius:0}

.chip{background:rgba(255,255,255,.7);border-color:var(--line)}
.toolbar input[type=search],.toolbar select,.sel,.seat-bar select{border-radius:999px;padding-inline:14px}
.export textarea{border-radius:var(--r-sm)}
.field input,.field select,.field textarea{border-radius:10px;background:rgba(255,255,255,.85);border:1px solid var(--line)}

.drawer{background:rgba(250,252,253,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-left:1px solid var(--glass-edge);box-shadow:-20px 0 60px rgba(21,40,62,.14);top:10px;bottom:10px;right:10px;border-radius:24px;width:min(640px,calc(100% - 20px));overflow:hidden}
.drawer header,.drawer footer{border-color:var(--line)}
.team-task{background:var(--accent-soft);border-radius:var(--r-sm)}
.savebar{left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 10px 8px 18px;border-radius:999px;background:rgba(21,32,43,.84);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(21,40,62,.25);width:max-content;max-width:calc(100% - 32px)}
.savebar .btn{background:#fff;color:var(--fg);border-color:transparent}

/* ---------- Minimal · Liquid Glass ---------- */
:root{--bg:#f7f9f8;--surface:rgba(255,255,255,.58);--glass-edge:rgba(255,255,255,.8);--line:rgba(21,40,62,.08);
  --shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(21,40,62,.03),0 1px 2px rgba(21,40,62,.04),0 12px 32px rgba(21,40,62,.06);
  --blur:blur(24px) saturate(180%)}
body{font-family:var(--f-body);font-weight:400;letter-spacing:.005em;-webkit-font-smoothing:antialiased}

hkeit (Fünf-Faktoren-Modell): Hintergrund, lexikalischer Ansatz, Einordnung\nAspekte der Big Five (Big Five Aspect Scales): je Dimension zwei Aspekte\nStabilität und Situationsabhängigkeit von Persönlichkeitsmerkmalen\nTeamrollen", "methods": "Fünf Tafeln (je eine pro Dimension, je zwei Aspekte mit Spektrum von links/niedrig bis rechts/hoch): Studierende tragen ihr Testergebnis mit Kreuzen ein, z. B. Extraversion → Durchsetzungsvermögen (links: nicht durchsetzungsfähig · rechts: sehr durchsetzungsfähig) und Enthusiasmus\nTafeln: Neurotizismus (Volatilität · Rückzug) · Extraversion (Enthusiasmus · Durchsetzungsvermögen) · Offenheit/Intellekt (Intellekt · Offenheit) · Verträglichkeit (Mitgefühl · Höflichkeit) · Gewissenhaftigkeit (Fleiß · Ordnungsliebe)\nTheoretischer Input der Dozierenden zu den Big Five · Ausgabe des Anhangs aus dem Handbuch\nAnwendungsfragen in Einzel- und Partnerarbeit · Übergabe des Klassenordners E10a", "team": "Erste Teamsitzung: Jede und jeder sichtet zunächst zwei Schülerakten. Führt dann die Klassensprecherwahl durch (Maßnahme „Klassensprecherwahl“ unter „Klassengemeinschaft“, 4 Zeit-Token). Mehr Zeit habt ihr in dieser Woche nicht. Den Sitzplan schaut ihr euch nur an: Die Sitzordnung beschließt ihr in Sitzung 3. Verteilt anschließend die weiteren Aufgaben aus der Mail der Schulleitung und vereinbart Regeln für eure Teamsitzungen.", "prep": "Persönlichkeitstest auf laufbahndiagnostik.ch durchführen und das Ergebnis (Auswertung) mitbringen.", "lit": "Handbuch zum BFAS-G-basierten Persönlichkeitsfragebogen, laufbahndiagnostik.ch (Anhang)\nDeYoung, C. G., Quilty, L. C. & Peterson, J. B. (2007). Between facets and domains: 10 aspects of the Big Five. Journal of Personality and Social Psychology, 93(5), 880–896.\nAsendorpf, J. B. & Neyer, F. J. (2012). Psychologie der Persönlichkeit (5. Aufl.). Springer.", "cases": [], "format": "Präsenz", "tokens": "4"}, {"id": "s03", "date": "2026-10-28", "block": 2, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "Peerbeziehungen im Jugendalter: Wahl reflektieren, Sitzordnung beschließen", "topics": "Wissenschaftlicher Input: Peerbeziehungen im Jugendalter – Funktion von Peergroups\nReflexion der Klassensprecherwahl anhand der soziometrischen Stati: Wer wurde gewählt, wer ging leer aus, wer hat sich gar nicht aufstellen lassen?\nAnwendung: Sitzordnung im Lehrerklassenteam beschließen – vorher die Klasse befragen (Plenum, anonym, Einzelne, Klassensprecher) oder direkt festlegen\nReflexion: Wie wirken Beteiligungsform und Sitzordnung auf Zugehörigkeit, Ruhe und Lernklima?", "goals": "Die Studierenden beschreiben Funktionen von Peergroups für die Entwicklung im Jugendalter.\nSie reflektieren das Ergebnis der Klassensprecherwahl mithilfe der soziometrischen Statusgruppen.\nSie wenden den Input bei der Entscheidung über die Sitzordnung an und begründen, ob und wie sie die Klasse beteiligen.", "theory": "Peergroups im Jugendalter: Funktionen für Zugehörigkeit, Ablösung, Identität und soziale Unterstützung\nSoziometrische Statusgruppen (Coie, Dodge & Coppotelli 1982): beliebt, abgelehnt, vernachlässigt, kontrovers, durchschnittlich\nKonformität und Meinungsführerschaft in Gruppen\nSitzordnung als Gestaltung der Peer-Ökologie durch Lehrkräfte (Gest & Rodkin 2011; van den Berg, Segers & Cillessen 2012)", "methods": "ca. 10 Min. Rückblick: Ergebnis der Klassensprecherwahl in der App · 30 Min. Input „Peerbeziehungen im Jugendalter: Funktion von Peergroups“ · 15 Min. Reflexion der Wahl anhand der soziometrischen Stati (über den Input; die Anzeige in der App bleibt bis Sitzung 4 ausgeblendet) · 30 Min. Teamsitzung in der App: Sitzplan → „Sitzordnung beschließen“ (Beteiligungsform wählen, Tische aufstellen, Beschluss mit dem Input begründen; die Plätze werden ausgelost) · 5 Min. Ausblick: Wirkung im Klassenklima beobachten", "team": "Schaut euch das Ergebnis eurer Klassensprecherwahl noch einmal an. Wer wurde gewählt, wer ging leer aus, wer hat sich gar nicht aufstellen lassen? Ordnet das mit dem Input zu Peergroups und den soziometrischen Stati ein.\nBeschließt dann im Klassenteam die Sitzordnung (Sitzplan → „Sitzordnung beschließen“). Entscheidet zuerst, ob und wie ihr die Klasse beteiligt: im Plenum, anonym, einzelne Auszubildende oder den Klassensprecher befragen, oder ohne Befragung festlegen. Jede Form kostet Zeit und zeigt euch ein anderes Bild der Klasse. Begründet Beteiligungsform und Aufstellung der Tische mit dem Input. Wer wo sitzt, wird ausgelost; einzelne Umsetzungen sind danach jederzeit möglich.", "prep": "", "lit": "Coie, J. D., Dodge, K. A. & Coppotelli, H. (1982). Dimensions and types of social status: A cross-age perspective. Developmental Psychology, 18(4), 557–570.\nGest, S. D. & Rodkin, P. C. (2011). Teaching practices and elementary classroom peer ecologies. Journal of Applied Developmental Psychology, 32(5), 288–296.\nvan den Berg, Y. H. M., Segers, E. & Cillessen, A. H. N. (2012). Changing peer perceptions and victimization through classroom arrangements: A field experiment. Journal of Abnormal Child Psychology, 40(3), 403–412.\nHoos, G.: Entwicklungspsychologie Jugendalter (Foliensatz Arbeitskunde).", "cases": ["lukas", "sarah", "nico", "deniz", "max", "niklas"]}, {"id": "s04", "date": "2026-11-11", "block": 2, "status": "idee", "visible": true, "lead": "Hoos", "format": "Präsenz", "title": "Neuropsychologie des Jugendalters", "topics": "Gehirnentwicklung im Jugendalter: Reifung, Belohnungssystem, Risikoverhalten\nPädagogische Konsequenzen\nLehrerverhalten\nBewusstmachung: jugendliches Verhalten verstehen statt persönlich nehmen\nNeu in der App: Anzeige „Soziometrischer Status“ im Sitzplan und in den Schülerakten", "goals": "Die Studierenden erklären zentrale Befunde zur Gehirnentwicklung im Jugendalter.\nSie leiten pädagogische Konsequenzen für ihr Lehrerverhalten ab.", "theory": "Dual-Systems-Modell (Steinberg)\nNeuronale Plastizität", "methods": "Input · Fallanalyse · Teamsitzung", "team": "Nico reagiert auf Kritik des Ausbilders impulsiv, Jonas geht in der Werkstatt Risiken ein. Welche Erklärung bietet die Neuropsychologie, und was folgt daraus für euer Verhalten?", "prep": "", "lit": "Steinberg, L. (2014). Age of Opportunity. Houghton Mifflin Harcourt.", "cases": ["nico", "jonas"]}, {"id": "s05", "date": "2026-11-18", "block": 2, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "Identität & Entwicklungsaufgaben", "topics": "Pubertät und Adoleszenz: Begriffe und Phasen (frühe, mittlere, späte, Post-Adoleszenz)\nEntwicklungsaufgaben nach Havighurst und Grob & Jaschinski\nPsychosoziale Entwicklung nach Erikson: Identität vs. Rollendiffusion, negative Identität\nIdentitätsstatus nach Marcia und berufliche Identität", "goals": "Die Studierenden unterscheiden Pubertät und Adoleszenz.\nSie ordnen die Auszubildenden der E10a Entwicklungsaufgaben und beruflichen Identitätsstatus zu.\nSie reflektieren, wie Lehrkräfte durch Zuschreibungen zu einer negativen Identität beitragen können.", "theory": "Entwicklungsaufgaben (Havighurst; Grob & Jaschinski 2003: intrapersonal, interpersonal, kulturell-gesellschaftlich)\nPsychosoziale Entwicklung (Erikson): Krise, psychosoziales Moratorium, negative Identität\nIdentitätsstatus-Modell (Marcia 1966): Exploration × Verpflichtung", "methods": "ca. 10 Min. Meldung und Klasse sichten · 30 Min. Input: Pubertät und Adoleszenz, Havighurst, Erikson, Marcia · 25 Min. Zuordnung der Patenfälle zu Identitätsstatus und begründete Maßnahmen · 20 Min. Reflexion: mein eigener beruflicher Identitätsstatus · 5 Min. Ausblick", "team": "Ordnet jedem eurer Patenfälle einen beruflichen Identitätsstatus nach Marcia zu und begründet es. Welche Entwicklungsaufgaben stehen an? Achtung: Die Hälfte der Klasse ist unauffällig. Und: Was ist seit den Herbstferien mit Lukas los? Beobachtet, statt zu diagnostizieren.", "prep": "", "lit": "Hoos, G.: Entwicklungspsychologie Jugendalter (Foliensatz Arbeitskunde).\nGrob, A. & Jaschinski, U. (2003). Erwachsen werden. Entwicklungspsychologie des Jugendalters. Beltz.\nErikson, E. H. (1973). Identität und Lebenszyklus. Suhrkamp.\nMarcia, J. E. (1966). Development and validation of ego-identity status. Journal of Personality and Social Psychology, 3(5), 551–558.\nLohaus, A. (Hrsg.): Entwicklungspsychologie des Jugendalters. Springer.", "cases": ["leon", "sarah", "max", "florian", "lukas"]}, {"id": "s06", "date": "2026-11-25", "block": 3, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "Angst: Prüfungsangst & soziale Angst", "topics": "Prüfungsangst als Angst vor fremder Bewertung\nPositionierung als Lehrkraft: Ich bin selbst Bewertende\nRückbezug auf Sitzung 2: Grundformen der Angst nach Riemann – eigene Grundstrebung und die der Schüler\nSoziale Angst: Wenn Auszubildende ein Referat halten müssen\nWarnsignale, Unterstützung, Weiterverweisen", "goals": "Die Studierenden erklären Entstehung und Komponenten von Prüfungsangst.\nSie reflektieren ihre eigene Rolle als bewertende Lehrkraft.\nSie planen angstsensible Prüfungs- und Präsentationssituationen.", "theory": "Transaktionales Stressmodell (Lazarus)\nBesorgnis und Aufgeregtheit als Komponenten der Prüfungsangst\nGrundformen der Angst (Riemann): Angst vor Nähe, Distanz, Veränderung und Endgültigkeit", "methods": "Selbstreflexion: eigene Prüfungserfahrungen · Input · Teamsitzung", "team": "Tim fehlt an Prüfungstagen und meidet sein Referat, Max reagiert auf eine Drei wie auf eine Katastrophe. Welche Grundform der Angst nach Riemann erkennt ihr bei den beiden, und welche bei euch selbst in der Rolle als Bewertende? Wo liegt die Grenze zwischen normaler Aufregung und behandlungsbedürftiger Angst? Wie gestaltet ihr Leistungserhebungen?", "prep": "", "lit": "Riemann, F. (1961/2019). Grundformen der Angst. Eine tiefenpsychologische Studie (Neuausgabe). Ernst Reinhardt.", "cases": ["tim", "max"]}, {"id": "s07", "date": "2026-12-02", "block": 3, "status": "idee", "visible": true, "lead": "Hoos", "format": "Präsenz", "title": "Depression im Jugendalter", "topics": "Erscheinungsbild: Auffälligkeiten, Rückzug, Konzentrationsprobleme\nAbgrenzung zur normalen Stimmungsschwankung\nLehrerverhalten: ansprechen, begleiten, weiterverweisen\nUmgang mit Hinweisen auf Suizidalität", "goals": "Die Studierenden erkennen Anzeichen einer Depression im Jugendalter.\nSie beschreiben die Grenzen ihrer Rolle und das schulische Unterstützungsnetz (Beratungslehrkraft, Schulpsychologie, Jugendhilfe).", "theory": "Vulnerabilitäts-Stress-Modell", "methods": "Input · Gesprächsübung: Sorge ansprechen · kollegiale Fallberatung", "team": "Lukas wirkt seit Wochen erschöpft und zurückgezogen. Führt eine kollegiale Fallberatung durch: Wer spricht ihn an, wie, und wen bezieht ihr ein?", "prep": "", "lit": "", "cases": ["lukas"]}, {"id": "s08", "date": "2026-12-09", "block": 3, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "ADHS", "topics": "Verhaltensmuster und Ursachen\nFallbeispiel: Interview mit einem Schüler\nLehrerverhalten\nStruktur und Ordner\nUmgang mit Prokrastination", "goals": "Die Studierenden erklären Entstehung und Erscheinungsbild von ADHS.\nSie planen strukturierende Unterstützung für einen konkreten Fall.", "theory": "Modell der Selbstregulation (Barkley)\nExekutive Funktionen", "methods": "Interview mit einem Schüler (falls möglich, sonst Fallvideo) · Input · Teamsitzung", "team": "Jonas hat seine Projektmappe seit drei Wochen nicht angefangen und im Elektrolabor ohne Freischaltung gearbeitet. Entwerft ein Ordner- und Strukturkonzept und eine Sofortregel für die Werkstatt.", "prep": "Interviewfragen an den Schüler vorbereiten", "lit": "Döpfner, M., Frölich, J. & Lehmkuhl, G. (2013). Aufmerksamkeitsdefizit-/Hyperaktivitätsstörung (ADHS) (2. Aufl.). Hogrefe.", "cases": ["jonas"]}, {"id": "s09", "date": "2026-12-16", "block": 3, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "LRS & Dyskalkulie", "topics": "Lese-Rechtschreib-Störung und Rechenstörung: Ursachen und Erscheinungsbild\nAbgrenzung zu Deutsch als Zweitsprache\nLehrerverhalten und Maßnahmen\nNachteilsausgleich und Notenschutz (Bayern), Nachteilsausgleich in der Kammerprüfung", "goals": "Die Studierenden erläutern Ursachen von LRS und Dyskalkulie.\nSie unterscheiden Nachteilsausgleich und Notenschutz und begründen Maßnahmen für einen Fall.", "theory": "Phonologische Informationsverarbeitung\nEntwicklung des Zahlverständnisses", "methods": "Selbsterfahrung: Lesen und Rechnen unter erschwerten Bedingungen · Fallarbeit", "team": "Mia kämpft mit dem Berichtsheft, Paul mit dem Ohmschen Gesetz, Yusuf mit Fachtexten. Formuliert für alle drei passende Maßnahmen.", "prep": "", "lit": "", "cases": ["mia", "paul", "yusuf"]}, {"id": "s10", "date": "2026-12-23", "block": 3, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Selbsterarbeitung", "title": "Medienkonsum & Sucht", "topics": "Mediennutzung Jugendlicher: Zahlen und Alltag\nGaming Disorder (ICD-11) und problematische Nutzung sozialer Medien\nCannabis nach der Teillegalisierung: Jugendschutz, Arbeitssicherheit, Rolle der Schule\nSuchtentstehung und Belohnungssystem (Bezug zu Sitzung 4)\nSelbstexperiment: eigene Bildschirmzeit eine Woche lang protokollieren", "goals": "Die Studierenden unterscheiden unproblematische, riskante und abhängige Nutzung.\nSie reflektieren ihren eigenen Medienkonsum.\nSie planen ein Gespräch über Konsum, das nicht moralisiert.", "theory": "Gaming Disorder (ICD-11, 6C51)\nNeurobiologie der Sucht (Belohnungssystem)\nMotivierende Gesprächsführung (Miller & Rollnick)", "methods": "Asynchron: Lernpfad mit Material und Selbstexperiment · Besprechung zu Beginn von Sitzung 11", "team": "Dennis spielt bis drei Uhr nachts, Marco kifft auch unter der Woche, Deniz nutzt Social Media kreativ und reflektiert. Ordnet die drei ein: unproblematisch, riskant, abhängig? Entwerft für einen Fall einen Gesprächsleitfaden, der nicht moralisiert.", "prep": "Bildschirmzeit vom 23.12. bis 06.01. protokollieren (Smartphone-Statistik)", "lit": "Medienpädagogischer Forschungsverbund Südwest: JIM-Studie (aktuelle Ausgabe).\nMiller, W. R. & Rollnick, S. (2015). Motivierende Gesprächsführung (3. Aufl.). Lambertus.", "cases": ["dennis", "marco", "deniz"]}, {"id": "s11", "date": "2027-01-13", "block": 4, "status": "idee", "visible": true, "lead": "Hacker", "format": "Praxiskontakt", "title": "Praxiskontakt & Positive Psychologie", "topics": "Rückblick Selbstexperiment Medienkonsum\nAuswertung des Praxiskontakts mit der Partnerklasse\nPositive Psychologie: Stärken statt Defizite\nMotivation und Selbstwirksamkeit von Auszubildenden\nRückbezug: eure Charakterstärken aus Sitzung 2", "goals": "Die Studierenden werten Daten aus der Partnerklasse aus und leiten Maßnahmen ab.\nSie begründen ressourcenorientierte Maßnahmen mit Motivationstheorien.", "theory": "PERMA-Modell (Seligman)\nCharakterstärken (VIA)\nSelbstbestimmungstheorie (Deci & Ryan)\nSelbstwirksamkeit (Bandura)", "methods": "Datenauswertung im Team · Input · Stärkenperspektive auf die Fälle", "team": "Ergänzt eure Förderpläne um die Stärkenperspektive: Welche Ressourcen haben eure Patenfälle (z. B. Yusuf, Florian, Sascha), und wie nutzt ihr sie? Stellt den Förderplan-Entwurf bis 19.01. in den Teamordner.", "prep": "", "lit": "Deci, E. L. & Ryan, R. M. (1993). Die Selbstbestimmungstheorie der Motivation und ihre Bedeutung für die Pädagogik. Zeitschrift für Pädagogik, 39(2), 223–238.", "cases": ["yusuf", "paul", "florian", "sascha"]}, {"id": "s12", "date": "2027-01-20", "block": 4, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "Gesprächsführung: Das schwierige Telefonat", "topics": "Kurzinput: Grundhaltungen nach Rogers und das Kommunikationsquadrat\nNicos Ausbilder will die Ausbildung beenden: ein Telefonat vorbereiten und üben\nFörderplan-Steckbrief: je ein Patenfall in drei Minuten\nFragen zur Klausur", "goals": "Die Studierenden bereiten ein schwieriges Gespräch mit einem Ausbildungsbetrieb strukturiert vor und führen es.\nSie stellen einen Förderplan knapp und fachlich begründet vor.", "theory": "Personzentrierte Gesprächsführung (Rogers)\nKommunikationsquadrat (Schulz von Thun)", "methods": "ca. 15 Min. Input · 35 Min. Vorbereitung und Rollenspiel zu zweit, die dritte Person beobachtet (Wechsel) · 20 Min. Förderplan-Steckbriefe · 20 Min. Klausurfragen", "team": "Nicos Ausbilder ruft an und will die Ausbildung beenden. Legt fest: Was ist euer Gesprächsziel, welche Fakten habt ihr, welche Unterstützung bietet ihr an? Übt das Telefonat reihum (Lehrkraft, Ausbilder, Beobachtung).", "prep": "Förderplan-Steckbrief für einen eigenen Patenfall (eine Seite: Beobachtung, Erklärung, Maßnahme, Zuständigkeit, Überprüfung)", "lit": "Schulz von Thun, F. (1981). Miteinander reden 1. Rowohlt.", "cases": ["nico"]}, {"id": "s13", "date": "2027-01-27", "block": 5, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Prüfung", "title": "Klausur", "topics": "Schriftliche Prüfung", "goals": "", "theory": "", "methods": "", "team": "", "prep": "", "lit": "", "cases": [], "tokens": "0"}, {"id": "s14", "date": "2027-02-03", "block": 5, "status": "idee", "visible": true, "lead": "Hoos, Hacker", "format": "Präsenz", "title": "Rückgabe der Klausur & Reflexion", "topics": "Rückgabe und Besprechung der Klausur\nRückbezug auf den Persönlichkeitsfragebogen: Was habe ich über mich gelernt?\nSeminarfeedback", "goals": "Die Studierenden reflektieren ihre Entwicklung im Seminar vor dem Hintergrund des Mottos.", "theory": "", "methods": "Reflexionsrunde · Feedback", "team": "", "prep": "", "lit": "", "cases": [], "tokens": "4"}], "cases": [{"id": "jonas", "name": "Jonas Pfaffenberger", "birth": "2010-03-12", "vorbildung": "Mittelschule (Quali)", "betrieb": "Elektro Hümmer GmbH, Pegnitz (12 Mitarbeitende)", "tag": "ADHS", "socio": "beliebt", "story": "Jonas ist der Erste, der morgens einen Witz macht, und der Letzte, der sein Material findet. Die ADHS-Diagnose bekam er mit neun Jahren, das Medikament hat er vor einem Jahr selbst abgesetzt, weil er sich damit „wie ausgeschaltet“ fühlte. Im Unterricht ruft er rein, springt zwischen Aufgaben und schiebt alles Schriftliche bis zum letzten Moment auf.\n\nIn der Werkstatt ist er schnell und findet Fehler in Schaltungen oft vor allen anderen. Schon in der ersten Laborwoche musste er an die Freischaltregeln erinnert werden.", "school": "Unruhig in Theoriephasen, sehr aktiv in Praxisphasen. Arbeitsblätter oft unvollständig, vergisst Termine.", "work": "Der Chef schätzt ihn auf der Baustelle („packt an“), die ersten Berichtsheft-Einträge fehlen aber.", "life": "Lebt mit Mutter und zwei jüngeren Geschwistern in Pegnitz. Spielt im Verein Fußball, das tut ihm gut.", "strengths": "Hilfsbereit, schnelle Auffassung in der Praxis, beliebt, humorvoll.", "questions": "Wie verbinden wir Struktur mit Arbeitssicherheit? Was hilft gegen das Aufschieben? Wer spricht mit dem Betrieb?", "av": {"skin": 1, "hair": "messy", "hc": "#8a5a2b", "shirt": "#2f5d8a", "bg": "#f2d6a2", "mouth": "smile", "brows": "up"}, "look": "16-jähriger Auszubildender im Elektrohandwerk, leicht gebräunte Haut, verstrubbelte kurze braune Haare, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "foerder", "marcia": "Diffuse Identität", "havighurst": "Erwerb intellektueller Fähigkeiten für die eigenen Pflichten; sozialverantwortliches Verhalten", "geschlecht": "m"}, {"id": "mia", "name": "Mia Schramm", "birth": "2010-09-07", "vorbildung": "Mittelschule (M-Zweig)", "betrieb": "Elektro Schramm & Sohn, Bayreuth (Familienbetrieb des Onkels)", "tag": "LRS", "socio": "durchschnittlich", "story": "Mia hat eine Lese-Rechtschreib-Störung, die in der Grundschule festgestellt wurde. In der Mittelschule hatte sie Notenschutz, an der Berufsschule hat das noch niemand beantragt. Sie schämt sich für ihre Fehler, schreibt im Unterricht kaum mit und meldet sich nur mündlich.\n\nBeim Verdrahten ist sie präzise und hat ein sehr gutes räumliches Vorstellungsvermögen. Ihr Onkel, der den Betrieb führt, hat sie in die Ausbildung geholt und erwartet viel.", "school": "Mündlich stark, schriftliche Leistungen weit darunter. Vermeidet Tafelanschriebe und Vorlesen.", "work": "Die ersten Berichtsheft-Einträge sind kurz und voller Fehler. Der Onkel hat schon nachgefragt und hält das für Nachlässigkeit.", "life": "Wohnt bei den Eltern in Bayreuth, ältere Schwester studiert. Zeichnet in der Freizeit.", "strengths": "Präzise, räumliches Denken, mündlich sehr klar, zuverlässig.", "questions": "Welcher Nachteilsausgleich ist möglich, auch in der Gesellenprüfung? Wie sprechen wir mit dem Onkel?", "av": {"skin": 0, "hair": "ponytail", "hc": "#c9a063", "shirt": "#7a3b3b", "bg": "#d7e3c8", "mouth": "neutral", "brows": "flat", "earrings": true}, "look": "16-jährige Auszubildende im Elektrohandwerk, helle Haut, zum Pferdeschwanz gebundene blonde Haare, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "foerder", "marcia": "Übernommene Identität", "havighurst": "Akzeptieren des eigenen Körpers und der eigenen Stärken; Berufsausbildung", "geschlecht": "w"}, {"id": "paul", "name": "Paul Kießling", "birth": "2010-01-22", "vorbildung": "Mittelschule (Quali)", "betrieb": "Elektrotechnik Rödel, Kulmbach", "tag": "Dyskalkulie", "socio": "beliebt", "story": "Paul scheitert an Formelumstellungen: Beim Ohmschen Gesetz oder bei der Leistungsberechnung verwechselt er Größen und Rechenschritte. Eine Rechenstörung wurde nie diagnostiziert, in der Mittelschule galt er als „schlecht in Mathe“ und hatte meist eine Fünf. Er überspielt das mit Witzen und schreibt bei Rechenaufgaben ab.\n\nIm Kundenkontakt ist er ein Naturtalent, und seine Installationen sind sauber. Vor der ersten Schulaufgabe in Elektrotechnik hat er jetzt schon Angst.", "school": "Gute Mitarbeit, bis gerechnet wird. Abschreiben bei Übungsaufgaben, Blackout bei Prüfungen mit Formeln.", "work": "Häufige Fehler beim Aufmaß und Ablängen, der Meister hält ihn für unkonzentriert.", "life": "Lebt mit Eltern auf einem Bauernhof bei Kulmbach, hilft viel mit.", "strengths": "Kundenorientiert, handwerklich ordentlich, sozial gut eingebunden, humorvoll.", "questions": "Wie erkennen wir eine Dyskalkulie im Berufsschulalter? Welche Hilfen gibt es in der Prüfung? Wie stärken wir seine Selbstwirksamkeit?", "av": {"skin": 0, "hair": "short", "hc": "#d2b48c", "shirt": "#3d6b3d", "bg": "#e8d7f0", "mouth": "smile", "brows": "flat"}, "look": "16-jähriger Auszubildender im Elektrohandwerk, helle Haut, kurze hellblonde Haare, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "foerder", "marcia": "Übernommene Identität", "havighurst": "Erwerb intellektueller Fähigkeiten; Berufsausbildung", "geschlecht": "m"}, {"id": "tim", "name": "Tim Dörfler", "birth": "2010-05-30", "vorbildung": "Realschule", "betrieb": "Stadtwerke Bayreuth (Elektroniker für Betriebstechnik)", "tag": "Prüfungsangst & soziale Angst", "socio": "vernachlässigt", "story": "Tim war schon in der Realschule auffällig oft an Prüfungstagen krank, meist mit Bauchschmerzen und Übelkeit. Auch in den ersten Wochen an der Berufsschule fehlte er bereits zwei Tage, beide Male mit Attest. Beim Gedanken, ein Referat vor der Klasse zu halten, bekommt er Herzrasen.\n\nWenn er da ist, sind seine schriftlichen Leistungen gut. Er ist gewissenhaft und bereitet sich übergründlich vor.", "school": "Still, meldet sich nie, wird von Mitschülern kaum wahrgenommen. Gute Hausaufgaben.", "work": "Im Betrieb unauffällig und gelöster, der Ausbilder lobt seine Sorgfalt.", "life": "Einzelkind, Vater Ingenieur mit hohen Erwartungen. Spielt Klavier.", "strengths": "Gewissenhaft, gründlich, gute schriftliche Leistungen, zuverlässig.", "questions": "Was vermeidet Tim eigentlich? Wie gestalten wir Prüfungs- und Präsentationssituationen, ohne ihn zu schonen oder bloßzustellen?", "av": {"skin": 0, "hair": "side", "hc": "#4a3322", "shirt": "#5b6f82", "bg": "#cfe0ea", "mouth": "neutral", "brows": "worried", "glasses": true}, "look": "16-jähriger Auszubildender im Elektrohandwerk, helle Haut, kurze, seitlich gescheitelte dunkelbraune Haare, Brille, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "foerder", "marcia": "Übernommene Identität", "havighurst": "Emotionale Unabhängigkeit von den Eltern; Aufbau reifer Beziehungen zu Gleichaltrigen", "geschlecht": "m"}, {"id": "lukas", "name": "Lukas Wunderlich", "birth": "2009-11-14", "vorbildung": "Mittelschule (Quali)", "betrieb": "Elektro Meyer, Bad Berneck", "tag": "Depression & Rückzug", "socio": "vernachlässigt", "story": "Lukas ist ein ruhiger, freundlicher Auszubildender, der sich in der Klasse noch nicht richtig angeschlossen hat. Seine Eltern haben sich im Sommer getrennt, seitdem wohnt er beim Vater. In den Pausen steht er meist mit Niklas zusammen, mit dem er auch morgens in den Betrieb fährt.\n\nEr ist begeistert von Smart-Home-Technik und hat sich selbst Programmieren beigebracht. In der Klasse meldet er sich selten, seine Leistungen sind solide.", "school": "Zurückhaltend, beteiligt sich wenig, arbeitet aber sorgfältig.", "work": "Der Ausbilder beschreibt ihn als ruhig, zuverlässig und technisch interessiert.", "life": "Eltern haben sich im Sommer getrennt, lebt beim Vater. Kaum Freunde außerhalb der Schule.", "strengths": "Technisch interessiert (Smart Home, Programmieren), sorgfältig, freundlich.", "questions": "Woran erkennen wir eine depressive Entwicklung? Wie reagieren wir auf die Äußerung? Wie gehen wir gegen das Video vor, ohne ihn bloßzustellen?", "av": {"skin": 0, "hair": "hood", "hc": "#3a2a1e", "shirt": "#44474d", "bg": "#d9d6cf", "mouth": "flat", "brows": "flat"}, "look": "16-jähriger Auszubildender im Elektrohandwerk, helle Haut, kurze dunkelbraune Haare, Kapuzenpulli mit aufgesetzter Kapuze, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "foerder", "marcia": "Diffuse Identität", "havighurst": "Aufbau reifer Beziehungen zu Gleichaltrigen; emotionale Unabhängigkeit", "geschlecht": "m"}, {"id": "nico", "name": "Nico Hofmann", "birth": "2008-08-02", "vorbildung": "Mittelschule (ohne Quali)", "betrieb": "Elektro Lang GmbH, Bayreuth", "tag": "Externalisierendes Verhalten", "socio": "kontrovers", "story": "Nico ist laut, schnell gereizt und wird gegenüber Lehrkräften verbal aggressiv; aus der Mittelschule bringt er zwei Verweise mit. Einige Mitschüler bewundern ihn, andere meiden ihn. Seine Eltern haben sich getrennt, als er zwölf war, seitdem pendelt er zwischen Mutter und Großmutter.\n\nIm Betrieb gab es in der Probezeit schon erste Konflikte mit dem Ausbilder, weil er zu spät kam. Mit seinem frisierten Roller ist er schon zweimal von der Polizei angehalten worden.", "school": "Provoziert in Theoriephasen, stellt sich vor Schwächere, wenn es drauf ankommt. Leistungen schwankend.", "work": "Handwerklich geschickt, aber erste Konflikte mit dem Ausbilder wegen Unpünktlichkeit.", "life": "Wohnt überwiegend bei der Großmutter. Jobbt am Wochenende an einer Tankstelle.", "strengths": "Handwerklich geschickt, übernimmt Verantwortung für Jüngere, loyal, direkt.", "questions": "Welche Entwicklungsaufgaben überfordern Nico? Was sagt die Neuropsychologie zu seinem Risikoverhalten? Wie verhindern wir den Ausbildungsabbruch?", "av": {"skin": 1, "hair": "buzz", "hc": "#2b2019", "shirt": "#1f1f1f", "bg": "#f0c9b5", "mouth": "smirk", "brows": "down", "stubble": true}, "look": "18-jähriger Auszubildender im Elektrohandwerk, leicht gebräunte Haut, sehr kurz geschorene schwarzbraune Haare, Dreitagebart, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "foerder", "marcia": "Diffuse Identität", "havighurst": "Sozialverantwortliches Verhalten; Berufsausbildung; Werte und ethisches System", "geschlecht": "m"}, {"id": "sarah", "name": "Sarah Lindner", "birth": "2007-04-19", "vorbildung": "Abitur", "betrieb": "Elektro Lindner, Weidenberg (Betrieb des Vaters)", "tag": "Erarbeitete berufliche Identität", "socio": "durchschnittlich", "story": "Sarah hat Abitur und sich bewusst gegen ein Studium entschieden: Sie hat Praktika in drei Berufen gemacht und dann entschieden, Elektronikerin zu werden und später den Betrieb ihres Vaters zu übernehmen. Sie ist zielstrebig und in der Werkstatt sicher.\n\nAls eine von zwei Frauen in der Klasse hört sie gelegentlich Sprüche. Meistens kontert sie selbstbewusst, manchmal ärgert es sie aber mehr, als sie zugibt.", "school": "Sehr gute Noten, engagiert, übernimmt gern Verantwortung in Gruppen.", "work": "Sehr gute Beurteilungen, der Vater lässt sie bewusst durch alle Abteilungen laufen.", "life": "Wohnt bei den Eltern, spielt Handball im Verein, Freundeskreis außerhalb der Klasse.", "strengths": "Leistungsstark, klare Ziele, durchsetzungsfähig, organisiert.", "questions": "Woran erkennt man eine erarbeitete Identität (Exploration und Verpflichtung)? Wie gehen wir mit Sprüchen in der Werkstatt um, ohne Sarah zur „Betroffenen“ zu machen?", "av": {"skin": 0, "hair": "long", "hc": "#6b3d1f", "shirt": "#2f5d8a", "bg": "#f5e1b8", "mouth": "neutral", "brows": "flat"}, "look": "19-jährige Auszubildende im Elektrohandwerk, helle Haut, lange kastanienbraune Haare, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "normal", "marcia": "Erarbeitete Identität", "havighurst": "Übernahme der Geschlechterrolle im Beruf; Berufsausbildung", "geschlecht": "w"}, {"id": "leon", "name": "Leon Baumgärtner", "birth": "2005-12-25", "vorbildung": "Abitur, 3 Semester Maschinenbau (abgebrochen)", "betrieb": "Elektro Wagner & Partner, Bayreuth", "tag": "Berufliches Moratorium", "socio": "durchschnittlich", "story": "Leon hat Maschinenbau studiert und nach drei Semestern gemerkt, dass ihm die Praxis fehlt. Die Ausbildung ist für ihn ein bewusster zweiter Anlauf, aber er probiert noch aus: Er schaut sich die Technikerschule an und fragt Mitschüler nac istern, übersetzt für die Eltern bei Behörden. Spielt Fußball.", "strengths": "Hohe Leistungsbereitschaft, praktisch sicher, hilfsbereit, ausdauernd.", "questions": "Welche Ressourcen bringt Yusuf mit? Wie gestalten wir Aufgaben sprachsensibel, ohne ihn zu unterfordern?", "av": {"skin": 3, "hair": "short", "hc": "#1a1410", "shirt": "#3d6b3d", "bg": "#cfe3e0", "mouth": "smile", "brows": "flat"}, "look": "17-jähriger Auszubildender im Elektrohandwerk, dunkle Haut, kurze schwarze Haare, Arbeitskleidung", "klasse": "E10a", "photo": "", "kategorie": "normal", "marcia": "Erarbeitete Identität", "havighurst": "Ökonomische Unabhängigkeit; Aufbau neuer Beziehungen", "geschlecht": "m"}, {"id": "dennis", "name": "Dennis Krauß", "birth": "2009-10-03", "vorbildung": "Mittelschule (Quali)", "betrieb": "Elektro Seidel GmbH, Bayreuth", "tag": "Medienkonsum & Gaming", "socio": "abgelehnt", "story": "Dennis spielt nach eigener Aussage „so sechs, sieben Stunden“ pro Tag Online-Games, oft bis spät in die Nacht. In den ersten Wochen kam er schon zweimal montags zu spät und wirkte übermüdet. Für Ingame-Käufe gibt er einen großen Teil seiner Ausbildungsvergütung aus.\n\nGespräche über sein Spielverhalten blockt er ab. Im Spiel ist er in einem Team erfolgreich und fühlt sich dort anerkannt, in der Klasse eckt er an.", "school": "Oft müde in der ersten Stunde, Handy unter dem Tisch.", "work": "Der Betrieb hat ihn schon auf Pünktlichkeit angesprochen.", "life": "Wohnt bei der Mutter, die im Schichtdienst arbeitet. Wenig Struktur am Abend.", "strengths": "Technisch versiert (PC-Bau, Netzwerke), teamfähig im Spiel, strategisches Denken.", "questions": "Ab wann ist Gaming problematisch? Wie sprechen wir ihn an, ohne zu moralisieren? Wie gehen wir mit den Schulden in der Klasse um?", "av": {"skin": 0, "hair": "messy", "hc": "#b58a4c", "shirt": "#44474d", "bg": "#d8d5ee", "mouth": "flat", "brows": "flat", "headphones": true}, "look": "16-jähriger Auszubildender im Elektrohandwerk, helle Haut, ver window.AK_DEMO = {store: {"updates/u02": {"date": "2026-10-20", "session": "s02", "students": [], "task": "Sichtet zuerst jede und jeder zwei Schülerakten. Führt dann die Klassensprecherwahl durch (Maßnahme „Klassensprecherwahl“ unter „Klassengemeinschaft“, 4 Zeit-Token). Mehr Zeit habt ihr in dieser Woche nicht. Den Sitzplan schaut ihr euch nur an: Die Sitzordnung beschließt ihr in Sitzung 3. Verteilt anschließend die weiteren Aufgaben und haltet die Verteilung im Teamordner fest.", "text": "Liebe Kolleginnen und Kollegen,\n\nSie übernehmen ab sofort gemeinsam als Klassenteam die Klassenleitung der E10a. Die Klasse hat 16 Auszubildende aus 11 Ausbildungsbetrieben, der Unterricht findet in Teilzeit an zwei Berufsschultagen pro Woche statt.\n\nFür Ihre erste Teamsitzung bitte ich Sie um zwei Dinge:\n\n• Verschaffen Sie sich einen ersten Eindruck: Jede und jeder von Ihnen sichtet zunächst die Akten von zwei Auszubildenden.\n• Führen Sie die Klassensprecherwahl durch. Fünf Auszubildende haben sich aufstellen lassen; gewählt werden die Klassensprecherin bzw. der Klassensprecher und die Stellvertretung.\n\nBisher sitzt die Klasse so, wie sie sich am ersten Schultag hingesetzt hat. Über die Sitzordnung entscheiden Sie in Ihrer nächsten Teamsitzung.\n\nMit freundlichen Grüßen\nDie Schulleitung", "title": "Mail der Schulleitung: Ihr übernehmt die E10a", "type": "Nachricht der Schulleitung", "id": "u02"}, "updates/u03": {"date": "2026-10-27", "session": "s03", "students": ["lukas", "sarah", "niklas", "nico", "deniz", "max"], "task": "Schaut euch das Ergebnis eurer Klassensprecherwahl noch einmal an: Passt es zu dem, was ihr bei der Gruppenarbeit beobachtet habt? Wer wurde gewählt, wer ging leer aus, wer hat sich gar nicht aufstellen lassen? Ordnet die Wahl mit dem Input zu Peergroups und den soziometrischen Stati ein. Beschließt dann im Klassenteam die Sitzordnung (Sitzplan → „Sitzordnung beschließen“): Befragt ihr die Klasse vorher, und wenn ja, wie? Begründet Beteiligungsform und Aufstellung der Tische mit dem Input.", "text": "Bei der ersten freien Gruppenarbeit im Elektrolabor dürfen sich die Auszubildenden selbst zusammenfinden. Nach drei Minuten stehen vier Gruppen, übrig bleiben Lukas und Sarah. Niklas schaut auf sein Handy.\n\nNico und Deniz finden sich sofort zusammen; in ihrer Gruppe wird am meisten gelacht und am wenigsten gearbeitet. Max versucht zu vermitteln, wird von Nico aber ausgelacht. Florian nennt sich selbst „den Opa der Klasse“.", "title": "Die ersten Wochen: Wer arbeitet mit wem?", "type": "Beobachtung", "id": "u03"}, "measures/4uktvaly": {"at": "2026-10-21T15:00:03.119Z", "by": "s-anna", "hours": 0, "tokens": 4, "kind": "wahl", "text": "Die fünf Kandidierenden stellen sich kurz vor. Wir wählen geheim mit Stimmzetteln und zählen öffentlich aus.", "students": ["jonas", "mia", "paul", "tim", "lukas", "nico", "sarah", "leon", "yusuf", "dennis", "marco", "sascha", "max", "florian", "deniz", "niklas"], "reactions": [{"student": "max", "text": "Max nimmt die Wahl strahlend an und verspricht, sich „für alle“ einzusetzen. Er bittet als Erstes darum, dass die Klasse ihre Wünsche zur Sitzordnung sammelt."}, {"student": "yusuf", "text": "Yusuf ist überrascht, Stellvertreter zu sein, und bedankt sich bei der Klasse auf Deutsch und Arabisch. Die Klasse klatscht."}, {"student": "jonas", "text": "Jonas nimmt es sportlich: „Dann bin ich halt der Klassenclown ohne Amt.“"}, {"student": "nico", "text": "Nico tut gleichgültig („War eh nur Spaß“), redet in der Pause aber auffällig lange über das Ergebnis."}, {"student": "sarah", "text": "Sarah hat nur eine Stimme bekommen. Sie sagt nichts, schreibt aber den Rest der Stunde nicht mehr mit."}], "result": [{"student": "max", "votes": 6}, {"student": "yusuf", "votes": 4}, {"student": "jonas", "votes": 3}, {"student": "nico", "votes": 2}, {"student": "sarah", "votes": 1}]}, "updates/u04": {"date": "2026-11-10", "session": "s04", "students": ["nico", "jonas"], "task": "Was sagt die Neuropsychologie zu diesem Verhalten? Was bedeutet das für eure Reaktion, jetzt und langfristig?", "text": "Nico fährt in der Mittagspause mit seinem Roller quer über den Schulhof und verfehlt knapp eine Gruppe Schüler. Als die Aufsicht ihn anspricht, sagt er „Chill mal, ist doch nix passiert“ und lacht mit seinen Freunden.\n\nAm Nachmittag arbeitet Jonas im Elektrolabor an einer Verteilung, ohne vorher freizuschalten. Ein Mitschüler bemerkt es rechtzeitig. Jonas sagt: „Ich wollte nur schnell was ausprobieren.“", "title": "Roller auf dem Schulhof, Labor ohne Freischaltung", "type": "Vorfall in der Pause", "id": "u04"}, "measures/sozio1": {"kind": "bef_sozio", "at": "2026-10-28T17:20:00.000Z", "by": "s-anna", "tokens": 2, "hours": 0, "text": "Soziometrische Befragung (Soziogramm).", "students": [], "reactions": [], "result": {"counts": {}, "abst": 0, "quotes": [], "sozio": {"v": 2, "choices": {"jonas": ["paul", "yusuf", "max"], "mia": ["sarah", "max", "deniz"], "paul": ["jonas", "max", "marco"], "tim": ["sascha", "florian", "leon"], "lukas": ["niklas", "deniz", "jonas"], "nico": ["jonas", "marco", "deniz"], "sarah": ["mia", "max", "yusuf"], "leon": ["florian", "sascha", "deniz"], "yusuf": ["jonas", "sascha", "paul"], "dennis": ["nico", "deniz", "marco"], "marco": ["nico", "paul", "jonas"], "sascha": ["yusuf", "leon", "max"], "max": ["paul", "jonas", "sarah"], "florian": ["niklas", "yusuf", "mia"], "deniz": ["nico", "yusuf", "max"], "niklas": ["lukas", "nico", "paul"]}, "rejects": {"jonas": ["dennis"], "mia": ["nico", "dennis"], "paul": ["nico", "leon"], "tim": ["nico"], "lukas": ["marco"], "nico": ["florian", "sarah", "niklas"], "sarah": ["nico", "dennis"], "leon": ["dennis"], "yusuf": ["dennis"], "dennis": ["max", "deniz", "mia"], "marco": [], "sascha": ["nico"], "max": ["dennis", "deniz"], "florian": ["nico", "dennis", "deniz"], "deniz": ["dennis", "sascha"], "niklas": []}}, "note": "Vertrauliche Befragung aller 16 Auszubildenden mit Namen: je drei Namen „Neben wem sitzt   function toMarkdown(){
    var m = state.meta, out = ["# " + m.course + " " + m.semester, "", "_" + m.motto + "_", "", "| Nr | Datum | Thema | Inhalte | Fälle | Dozierende |", "|---|---|---|---|---|---|"];
    state.sessions.forEach(function(s,i){
      out.push("| " + (i+1) + " | " + fmtDate(s.date) + " | " + (s.title||"").replace(/\|/g,"/") + " | " + lines(s.topics).join("<br>").replace(/\|/g,"/") + " | " + (s.cases||[]).map(function(c){ var x = caseById(c); return x ? x.name : ""; }).join(", ") + " | " + (s.lead||"") + " |");
    });
    return out.join("\n");
  }
  function toCSV(){
    var cols = ["nr","datum","block","format","titel","themen","lernziele","theorien","methoden","teamauftrag","vorbereitung","literatur","faelle","dozierende","status","sichtbar"];
    var q = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
    var rows = [cols.join(";")];
    state.sessions.forEach(function(s,i){
      rows.push([i+1, s.date, blockById(s.block).name, s.format||"", s.title, s.topics, s.goals, s.theory, s.methods, s.team, s.prep, s.lit, (s.cases||[]).join(", "), s.lead, s.status, s.visible ? "ja" : "nein"].map(q).join(";"));
    });
    return "﻿" + rows.join("\r\n");
  }

  document.addEventListener("input", function(ev){

      return;
    }
    if (t.hasAttribute("data-case") && ui.editing){
      var s2 = state.sessions.filter(function(x){ return x.id === ui.editing.id; })[0]; if (!s2) return;

    }
    if (t.hasAttribute("data-cf") && ui.editing){
      var c = caseById(ui.editing.id); if (!c) return;

    if (t.hasAttribute("data-idea")){ var it = live.ideas.filter(function(x){ return x.id === t.getAttribute("data-idea"); })[0]; if (it) it[t.getAttribute("data-if")] = t.value; return; }
    if (t.hasAttribute("data-mf") && ui.measure){ ui.measure[t.getAttribute("data-mf")] = t.value; var sb = document.querySelector('[data-act="submitmeasure"]'); if (sb)  var itx = MKIND[ui.measure.kind]; sb.disabled = !actionsOpen() || (itx && tokenCost(itx.k) > tokenState().free) || (!ui.measure.students.length && !(itx && itx.all)) || !ui.measure.text.trim() || !itx || (itx.lock && !foerderUnlocked()) || (itx.cost && foerderUsed() + measureCost(itx, ui.measure.students) > foerderBudget()) || (itx.max && ui.measure.students.length > itx.max); return; }
    if (t.hasAttribute("data-sd") && ui.seatDecide){ ui.seatDecide[t.getAttribute("data-sd")] = t.value; return; }
    if (t.hasAttribute("data-sdl") && ui.seatDecide){ ui.seatDecide.layout = t.getAttribute("data-sdl"); render(); return; }
    if (t.hasAttribute("data-sdst") && ui.seatDecide){ var sid0 = t.getAttribute("data-sdst"), arr0 = ui.seatDecide.einzel || (ui.seatDecide.einzel = []); if (t.checked){ if (arr0.indexOf(sid0) < 0 && arr0.length < 3) arr0.push(sid0); } else ui.seatDecide.einzel = arr0.filter(function(x){ return x !== sid0; }); render(); return; }
    if (t.hasAttribute("data-mk") && ui.measure){ ui.measure.kind = t.getAttribute("data-mk"); render(); return; }
    if (t.hasAttribute("data-mst") && ui.measure){ var ms = t.getAttribute("data-mst"); ui.measure.students = ui.measure.students.filter(function(x){ return x !== ms; }); if (t.checked) ui.measure.students.push(ms); render(); return; }
    if (t.hasAttribute("data-metab")){ state.meta[t.getAttribute("data-metab")] = t.checked; markDirty(); render(); return; }
    if (t.hasAttribute("data-meta")){ state.meta[t.getAttribute("data-meta")] = t.value; var wd2 = dirty; markDirty(); if (!wd2) render(); return; }
  });
  document.addEventListener("change", function(ev){
    var t = ev.target;
    if (t.id === "c-photo" && t.files && t.files[0] && ui.editing){
      var cid = ui.editing.id, file = t.files[0], fr = new FileReader();
      fr.onload = function(){ var img = new Image(); img.onload = function(){
        var S = 320, cv = document.createElement("canvas"); cv.width = S; cv.height = S; var cx = cv.getContext("2d");
        var m = Math.min(img.width, img.height); cx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
        var c = caseById(cid); if (!c) return; try { c.photo = cv.toDataURL("image/jpeg", 0.82); } catch(e){ toast("Bild konnte nicht verarbeitet werden"); return; }
        markDirty(); render(); toast("Bild übernommen – zum Veröffentlichen „Für alle speichern“");
      }; img.onerror = function(){ toast("Diese Datei ist kein lesbares Bild"); }; img.src = fr.result; };
      fr.readAsDataURL(file); return;
    }
    if (t.id === "f-block"){ ui.block = t.value; render(); }
    if (t.id === "f-book"){ ui.bookFilter = t.value; render(); }
    if (t.id === "f-layout"){ changeLayout(t.value); render(); }
    if (t.id === "f-seatcolor"){ ui.seatColor = t.value; render(); }
    if (t.id === "f-seatver"){ ui.seatVer = t.value === "live" ? null : +t.value; ui.seatSel = null; render(); }
    if (t.hasAttribute("data-idea") && db){ var f = {}; f[t.getAttribute("data-if")] = t.value; db.doc("intern/board/ideas/" + t.getAttribute("data-idea")).update(f).catch(function(){ toast("Idee konnte nicht gespeichert werden"); }); if (t.tagName === "SELECT") render(); }
    if ((t.id === "logo-uni" || t.id === "logo-school") && t.files && t.files[0]){
      var key = t.id === "logo-uni" ? "logoUni" : "logoSchool", fr2 = new FileReader();
      fr2.onload = function(){ var img = new Image(); img.onload = function(){ var W = Math.min(560, img.width), H = Math.round(img.height * W / img.width), cv = document.createElement("canvas"); cv.width = W; cv.height = H; cv.getContext("2d").drawImage(img, 0, 0, W, H); try { state.meta[key] = cv.toDataURL("image/png"); } catch(e){ return; } markDirty(); render(); toast("Logo übernommen – zum Veröffentlichen „Für alle speichern“"); }; img.src = fr2.result; };
      fr2.readAsDataURL(t.files[0]); return;

    if (t.hasAttribute("data-uf") && t.type === "checkbox"){}

  document.addEventListener("keydown", function(ev){ if (ev.key === "Enter" && ev.target && ev.target.id === "doz-pass"){ var pv2 = ev.target.value; if (pv2) ghLecturer(pv2, false); return; } if (ev.key === "Escape" && ui.seatDecide){ ui.seatDecide = null; render(); return; } if (ev.key === "Escape" && (ui.editing || ui.viewCase || ui.viewUpd || ui.measure)){ ui.editing = null; ui.viewCase = null; ui.viewUpd = null; ui.measure = null; ui.uDraft = null; ui.confirmDel = null; render(); } });


  var dragSrc = null;
  document.addEventListener("dragstart", function(ev){ var t = ev.target.closest && ev.target.closest("[data-drag],[data-dragstu]"); if (!t) return; dragSrc = t.hasAttribute("data-drag") ? {kind:"seat", id:t.getAttribute("data-drag")} : {kind:"student", id:t.getAttribute("data-dragstu")}; try { ev.dataTransfer.setData("text/plain", dragSrc.id); ev.dataTransfer.effectAllowed = "move"; } catch(e){} });
  document.addEventListener("dragover", function(ev){ if (dragSrc && ev.target.closest && ev.target.closest("[data-drop]")) ev.preventDefault(); });
  document.addEventListener("drop", function(ev){ var t = ev.target.closest && ev.target.closest("[data-drop]"); if (!t || !dragSrc) return; ev.preventDefault(); var id = t.getAttribute("data-drop");
    if (ui.seatVer != null){ dragSrc = null; toast("Gespeicherte Versionen lassen sich nicht ändern"); return; }
    seatMove(dragSrc, id === "tray" ? {kind:"tray"} : {kind:"seat", id:id}); dragSrc = null; ui.seatSel = null; render(); });
  document.addEventListener("dragend", function(){ dragSrc = null; });

  // ---------- Start ----------
  var authKnown = false, pendingDoz = false;
  function enterDoz(){
    pendingDoz = false;
    if (!canEdit){ ui.dozDenied = true; render(); return; }
    ui.entered = "doz"; ui.preview = false; ui.dozDenied = false; try { sessionStorage.setItem("arbeitskunde-in", "doz"); } catch(e){} render(); window.scrollTo(0,0);
  }
  function resetSimulation(){
    pending = {seating:null, events:[], measures:[]}; savePending();
    if (GH){ ghApi("reset", {password:ghPass()}).then(function(r){ ghApply(r); toast("Auf Normalzustand zurückgesetzt"); }, function(){ toast("Zurücksetzen hat nicht geklappt"); }); return; }
    if (!db) return;
    var ops = live.measures.map(function(m){ return function(){ return db.doc("measures/" + m.id).delete(); }; })
      .concat(live.events.map(function(e){ return function(){ return db.doc("events/" + e.id).delete(); }; }))
      .concat([function(){ return db.doc("live/seating").delete(); }]);
    toast("Simulation wird zurückgesetzt …");
    ops.reduce(function(pr, op){ return pr.then(op); }, Promise.resolve()).then(function(){ toast("Auf Normalzustand zurückgesetzt"); }, function(){ toast("Zurücksetzen nur teilweise gelungen"); });
  }
  try { var ent = sessionStorage.getItem("arbeitskunde-in"); if (ent === "stud"){ ui.entered = "stud"; ui.preview = true; } else if (ent === "doz"){ ui.entered = "stud"; ui.preview = true; pendingDoz = "silent"; } } catch(e){}
  try {
    var dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (dr && dr.data && JSON.stringify(dr.data) !== JSON.stringify(saved)) ui.restore = dr; else if (dr) clearDraft();
  } catch(e){}
  render();
  try { if (ui.entered === "stud" && !pendingDoz && classOpen() && localStorage.getItem("arbeitskunde-tour") === "pre") setTimeout(function(){ if (!editMode()){ if (ui.popup || ui.viewUpd) tourLater = true; else tourStart(); } }, 600); } catch(e){}

  if (window.AK_DEMO){
    db = memDb(); var DS = window.AK_DEMO.store || {};
    Object.keys(DS).forEach(function(k){ db.doc(k).set(DS[k]); });
    Object.keys(window.AK_DEMO.names || {}).forEach(function(k){ names[k] = window.AK_DEMO.names[k]; });
    myId = "gast"; authKnown = true; subscribeAll(); render();
  } else if (window.claude && window.claude.use){
    connectDb();
    window.claude.use("user").then(function(user){
      userApi = user;
      if (!user) return null;
      if (user.id) user.id().then(function(i){ myId = i; }, function(){});
      if (user.can) user.can("data.write").then(function(v){ if (v === false) canWrite = false; }, function(){});
      return user.canEdit().then(function(v){ canEdit = !!v; });
    }).then(function(){
      if (!canEdit) return null;
      return window.claude.use("artifact").then(function(a){ artifactApi = a; });
    }).catch(function(){}).then(function(){
      authKnown = true;
      if (canEdit) connectIntern();
      if (pendingDoz === "silent"){ pendingDoz = false; if (canEdit){ ui.entered = "doz"; ui.preview = false; } }
      else if (pendingDoz) enterDoz();
      if (!canEdit && (ui.tab === "export" || ui.tab === "ideen")) ui.tab = "plan";
