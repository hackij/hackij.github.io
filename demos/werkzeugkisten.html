<body>
<title>Werkzeugkisten Spengler · Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Immer helles Farbschema. Layout: eine schmale, daumenfreundliche Spalte aus Glas-Karten über ruhigen Farbflecken; Lehrkraft- und Druckansicht dürfen breiter werden. */
:root{
  --bg:#f4f7fb; --fg:#13212f; --muted:#5a6b7c; --line:rgba(19,33,47,.10);
  --glass:rgba(255,255,255,.7); --glass-strong:rgba(255,255,255,.9); --glass-edge:rgba(255,255,255,.9);
  --accent:#00377b; --accent-ink:#ffffff; --blob1:#8db4e6; --blob2:#c9dcf3; --blob3:#5d8fd0;
  --ok:#1f8a55; --ok-soft:rgba(31,138,85,.13); --bad:#c8352e; --bad-soft:rgba(200,53,46,.12);
  --more:#c27a0e; --more-soft:rgba(194,122,14,.14); --idle:#8a98a6;
  --f-display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body:"Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --r:20px; --shadow:0 10px 30px rgba(20,40,70,.10), inset 0 1px 0 var(--glass-edge);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);min-height:100vh;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:var(--blob1);top:-14vmax;left:-12vmax}
.blobs i:nth-child(2){width:34vmax;height:34vmax;background:var(--blob2);bottom:-10vmax;right:-8vmax;opacity:.6}
.blobs i:nth-child(3){width:22vmax;height:22vmax;background:var(--blob3);top:45%;left:60%;opacity:.18}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:1180px}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:700;line-height:1;letter-spacing:0}
h2{font-size:1.35rem;font-weight:700;letter-spacing:0}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top a{color:var(--accent);font-weight:600;text-decoration:none}
.logo{display:block;width:auto;max-width:60vw;object-fit:contain}
.sheet .logo{margin-bottom:2mm}
.hero{padding:20px;display:flex;flex-direction:column;gap:8px}
.demo{font-size:.82rem;padding:10px 14px;border-radius:14px;background:var(--more-soft);color:var(--fg);border:1px solid var(--line)}
.demo b{color:var(--more)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--glass-strong);color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Kistenraster */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;padding:12px}
.kbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;border-radius:14px;text-decoration:none;color:var(--fg);
  background:var(--glass-strong);border:1px solid var(--line);min-width:0;overflow:hidden}
.kbtn .n{font:800 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.kbtn .s{font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;white-space:nowrap}
.kbtn .s span{overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.more{background:var(--more)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:0 16px 14px}
.legend span{display:flex;align-items:center;gap:6px}

/* Live-Hinweise */
.live{padding:16px;display:flex;flex-direction:column;gap:10px}
.live-h{display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok-soft)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.hint{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line)}
.hint .ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--glass-strong)}
.hint .ico svg{width:30px;height:30px}
.hint .txt{flex:1;min-width:0}
.hint.get{background:var(--ok-soft)}
.hint.give{background:var(--more-soft)}
.hint.none{background:var(--bad-soft)}
.hint b{font-weight:700}
.allgood{padding:12px;border-radius:14px;background:var(--ok-soft);font-weight:600}

/* Formular */
.setup{padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:600;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{padding:12px;display:flex;flex-direction:column;gap:10px}
.tool-h{display:flex;gap:12px;align-items:center}
.pic{width:68px;height:68px;flex:none;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--fg)}
.pic img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pic svg{width:44px;height:44px}
.pic.foto svg{display:none}
.tag{position:absolute;right:4px;bottom:4px;font:800 .7rem/1 var(--f-body);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 5px}
.tname{flex:1;min-width:0}
.tname .nr{font-size:.75rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tname .nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice button{border:1.5px solid var(--line);background:var(--glass-strong);border-radius:12px;padding:10px 4px;font-weight:600;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.choice button .sym{font-size:1.05rem;font-weight:800}
.choice button.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.choice button.fehlt[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.choice button.mehr[aria-pressed="true"]{background:var(--more);border-color:var(--more);color:#fff}
.stepper{display:flex;align-items:center;gap:10px;font-size:.9rem;padding:8px 10px;border-radius:12px;background:var(--more-soft)}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--glass-strong);font-weight:800}
.stepper b{font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
.tool.done{border-color:transparent}
.submitbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:12px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--glass-strong)}
.progress{font-weight:700;font-variant-numeric:tabular-nums}
.thanks{padding:20px;display:flex;flex-direction:column;gap:10px}
.sumlist{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.more{background:var(--more-soft);color:var(--more);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.err{padding:12px 14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-weight:600}

/* Tauschbörse */
.board{padding:16px;display:flex;flex-direction:column;gap:10px}
.trade{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.trade .route{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.trade .w{min-width:0}

/* Lehrkraft */
.pin{padding:20px;display:flex;flex-direction:column;gap:12px;max-width:380px}
.pin input{font:inherit;font-size:1.3rem;letter-spacing:.15em;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong);color:var(--fg);width:100%}
.matrix-wrap{overflow-x:auto;padding:4px 0}
table.matrix{border-collapse:separate;border-spacing:3px;font-size:.8rem;min-width:100%}
.matrix th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;white-space:nowrap}
.matrix th.k{font:800 .95rem var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;vertical-align:bottom;padding:6px 2px}
.matrix td{width:26px;height:26px;border-radius:7px;text-align:center;font-weight:800;background:var(--line)}
.matrix td.ok{background:var(--ok-soft);color:var(--ok)}
.matrix td.fehlt{background:var(--bad);color:#fff}
.matrix td.mehr{background:var(--more);color:#fff}
.matrix td.meta{width:auto;background:transparent;font-weight:500;color:var(--muted);text-align:left;white-space:nowrap;padding:0 8px}
.chron{padding:16px;display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.ev .kno{font:800 1.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.ev .kno small{display:block;font:600 .68rem var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.ev .when{font-size:.82rem;color:var(--muted)}
.ev.alarm{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.between{font-size:.84rem;padding:8px 10px;border-radius:10px;background:var(--bad-soft)}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass-strong);color:var(--fg)}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:980px){.cols{grid-template-columns:3fr 2fr}}
.cols > *{min-width:0}

/* Druckbögen */
.sheets{display:flex;flex-direction:column;gap:24px;align-items:center}
.sheet{width:100%;max-width:210mm;aspect-ratio:210/297;background:#fff;color:#13212f;border-radius:6px;position:relative;overflow:hidden;
  padding:12mm 13mm;display:flex;flex-direction:column;gap:6mm;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.sheet .sb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.45;z-index:0}
.sheet > *:not(.sb){position:relative;z-index:1}
.sheet-h{display:grid;grid-template-columns:1fr auto;gap:6mm;align-items:start}
.sheet-h .big{font:800 clamp(1.6rem,6vw,3rem)/1 var(--f-display);color:#13212f}
.sheet-h .sub{font-size:clamp(.7rem,1.8vw,.95rem);color:#4a5a6a}
.qr{width:clamp(70px,22vw,44mm);aspect-ratio:1;background:rgba(255,255,255,.85);border-radius:10px;padding:2mm;border:1px solid rgba(19,33,47,.12)}
.qr svg{width:100%;height:100%;display:block}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;font-size:clamp(.55rem,1.5vw,.78rem)}
.steps div{background:rgba(255,255,255,.7);border:1px solid rgba(19,33,47,.1);border-radius:8px;padding:2mm}
.steps b{display:block;font:800 1.1em var(--f-display);color:#00377b}
.slist{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm 4mm;font-size:clamp(.55rem,1.6vw,.85rem);flex:1;align-content:start}
.slist div{display:flex;align-items:center;gap:2.5mm;padding:1.3mm 2mm;border-radius:7px;background:rgba(255,255,255,.72);border:1px solid rgba(19,33,47,.08)}
.slist .sn{font-weight:800;color:#00377b;min-width:1.6em;font-variant-numeric:tabular-nums}
.slist .sp{width:2.6em;height:2.6em;flex:none;display:grid;place-items:center;background:#fff;border-radius:6px;overflow:hidden}
.slist svg{width:1.7em;height:1.7em;color:#13212f}
.slist .sp img{width:100%;height:100%;object-fit:contain}
.slist .sp.foto svg{display:none}
.sheet-f{display:flex;justify-content:space-between;font-size:clamp(.5rem,1.4vw,.75rem);color:#4a5a6a;border-top:1px solid rgba(19,33,47,.12);padding-top:2mm}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .blobs,.noprint{display:none!important}
  .wrap{padding:0!important;max-width:none}
  .sheets{gap:0}
  .sheet{box-shadow:none;border-radius:0;width:210mm;height:297mm;max-width:none;break-after:page;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet-h .big{font-size:3rem}.sheet-h .sub{font-size:.95rem}.qr{width:44mm}
  .steps{font-size:.78rem}.slist{font-size:.9rem}.sheet-f{font-size:.75rem}
}
</style>

function pic(w, size){
  const t = WERKZEUGE.find(x=>x.id===w); const nn = String(w).padStart(2,"0");
  return `<div class="pic"${size?` style="width:${size}px;height:${size}px"`:""}>${ICONS[t.icon]}
    <img src="${IMG[nn]||""}" alt="" onload="this.parentNode.classList.add('foto')" onerror="this.remove()">
    ${t.lr?`<span class="tag">${t.lr}</span>`:""}</div>`;
}

/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const fmt = s => new Date(s).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtDay = s => new Date(s).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const KISTEN = Array.from({length:CONFIG.ANZAHL_KISTEN}, (_,i)=>i+1);

/* ============================================================
   DATENSPEICHER: Demo (lokal) oder Supabase (live für alle)
   ============================================================ */
function demoStore(){
  const KEY = "wk-demo-v1"; let mem = null; let ch = null;
  try{ ch = new BroadcastChannel("wk-demo"); }catch(e){}
  const subs = [];
  function seed(){
    const now = Date.now(), ago = h => new Date(now - h*36e5).toISOString();
    const bestand = [];
    for (const k of KISTEN.slice(0, Math.min(8, KISTEN.length)))
      for (const w of WERKZEUGE) bestand.push({kiste:k, werkzeug:w.id, status:"ok", anzahl:0, klasse:"MKP11", phase:"start", updated_at:ago(1)});
    const set = (k,w,status,anzahl=0)=>{ const r = bestand.find(x=>x.kiste===k&&x.werkzeug===w); if(r){ r.status=status; r.anzahl=anzahl; } };
    set(1,2,"fehlt"); set(5,2,"mehr",1); set(3,15,"fehlt"); set(6,7,"mehr",1);
    const meldungen = [
      {id:6, created_at:ago(1), kiste:6, klasse:"MKP11", phase:"start", art:"kontrolle", fehlt:[], mehr:[{w:7,n:1}]},
      {id:5, created_at:ago(1.1), kiste:5, klasse:"MKP11", phase:"start", art:"kontrolle", fehlt:[], mehr:[{w:2,n:1}]},
      {id:4, created_at:ago(1.2), kiste:3, klasse:"MKP11", phase:"start", art:"kontrolle", fehlt:[15], mehr:[]},
      {id:3, created_at:ago(1.3), kiste:1, klasse:"MKP11", phase:"start", art:"kontrolle", fehlt:[2], mehr:[]},
      {id:2, created_at:ago(75), kiste:3, klasse:"MKP12", phase:"ende", art:"kontrolle", fehlt:[], mehr:[]},
      {id:1, created_at:ago(75.2), kiste:1, klasse:"MKP12", phase:"ende", art:"kontrolle", fehlt:[], mehr:[]}
    ];
    return {bestand, meldungen, nextId:7};
  }
  function db(){ if(!mem){ mem = LS.get(KEY,null) || seed(); LS.set(KEY,mem); } return mem; }
  function save(){ LS.set(KEY,mem); subs.forEach(f=>f()); try{ ch && ch.postMessage("x"); }catch(e){} }
  if (ch) ch.onmessage = () => { mem = LS.get(KEY, mem); subs.forEach(f=>f()); };
  window.addEventListener("storage", e => { if(e.key===KEY){ mem = LS.get(KEY, mem); subs.forEach(f=>f()); } });
  return {
    async load(){ const d = db(); return {bestand: d.bestand.slice(), meldungen: d.meldungen.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at))}; },
    async submit({kiste,klasse,phase,items}){
      const d = db(), now = new Date().toISOString();
      d.bestand = d.bestand.filter(r=>r.kiste!==kiste);
      for (const w of WERKZEUGE){ const it = items[w.id]; d.bestand.push({kiste, werkzeug:w.id, status:it.status, anzahl: it.status==="mehr"?it.anzahl:0, klasse, phase, updated_at:now}); }
      d.meldungen.push({id:d.nextId++, created_at:now, kiste, klasse, phase, art:"kontrolle",
        fehlt: WERKZEUGE.filter(w=>items[w.id].status==="fehlt").map(w=>w.id),
        mehr: WERKZEUGE.filter(w=>items[w.id].status==="mehr").map(w=>({w:w.id,n:items[w.id].anzahl}))});
      save();
    },
    async tausch(von,nach,werkzeug,klasse){
      const d = db(); const ziel = d.bestand.find(r=>r.kiste===nach&&r.werkzeug===werkzeug);
      const quelle = d.bestand.find(r=>r.kiste===von&&r.werkzeug===werkzeug);
      if(!ziel || ziel.status!=="fehlt" || !quelle || quelle.status!=="mehr") return false;
      const now = new Date().toISOString();
      ziel.status="ok"; ziel.anzahl=0; ziel.updated_at=now;
      quelle.anzahl = Math.max(0, quelle.anzahl-1); if(quelle.anzahl===0) quelle.status="ok"; quelle.updated_at=now;
      d.meldungen.push({id:d.nextId++, created_at:now, kiste:nach, klasse, phase:"tausch", art:"tausch", werkzeug, partner:von, fehlt:[], mehr:[]});
      save(); return true;
    },
    async pinOk(pin){ return pin === "1234"; },
    async kisteOk(pin,kiste){
      if(pin!=="1234") throw new Error("PIN falsch");
      const d = db(), now = new Date().toISOString();
      d.bestand = d.bestand.filter(r=>r.kiste!==kiste);
      for (const w of WERKZEUGE) d.bestand.push({kiste, werkzeug:w.id, status:"ok", anzahl:0, klasse:"–", phase:"lehrer", updated_at:now});
      d.meldungen.push({id:d.nextId++, created_at:now, kiste, klasse:"Lehrkraft", phase:"lehrer", art:"lehrer", fehlt:[], mehr:[]});
      save();
    },
    reset(){ mem = seed(); save(); },
    subscribe(f){ subs.push(f); }
  };
}

function supaStore(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  return {
    async load(){
      const [b,m] = await Promise.all([
        sb.from("bestand").select("*"),
        sb.from("meldungen").select("*").order("created_at",{ascending:false}).limit(600)
      ]);
      if (b.error) throw b.error; if (m.error) throw m.error;
      return {bestand:b.data, meldungen:m.data};
    },
    async submit({kiste,klasse,phase,items}){
      const now = new Date().toISOString();
      const rows = WERKZEUGE.map(w=>({kiste, werkzeug:w.id, status:items[w.id].status, anzahl: items[w.id].status==="mehr"?items[w.id].anzahl:0, klasse, phase, updated_at:now}));
      let r = await sb.from("bestand").upsert(rows); if (r.error) throw r.error;
      r = await sb.from("meldungen").insert({kiste, klasse, phase, art:"kontrolle",
        fehlt: WERKZEUGE.filter(w=>items[w.id].status==="fehlt").map(w=>w.id),
        mehr: WERKZEUGE.filter(w=>items[w.id].status==="mehr").map(w=>({w:w.id,n:items[w.id].anzahl}))});
      if (r.error) throw r.error;
    },
    async tausch(von,nach,werkzeug,klasse){
      const r = await sb.rpc("tausch_erledigt",{p_von:von, p_nach:nach, p_werkzeug:werkzeug, p_klasse:klasse});
      if (r.error) throw r.error; return r.data === true;
    },
    async pinOk(pin){ const r = await sb.rpc("lehrer_pin_ok",{p_pin:pin}); return !r.error && r.data === true; },
    async kisteOk(pin,kiste){ const r = await sb.rpc("lehrer_kiste_ok",{p_pin:pin, p_kiste:kiste}); if (r.error) throw r.error; if (r.data!==true) throw new Error("PIN falsch"); },
    subscribe(f){
      sb.channel("werkzeug-live")
        .on("postgres_changes",{event:"*",schema:"public",table:"bestand"},f)
        .on("postgres_changes",{event:"*",schema:"public",table:"meldungen"},f)
        .subscribe();
    }
  };
}

const S = {bestand:[], meldungen:[], loaded:false, error:null};

function kisteStatus(k){
  const rows = S.bestand.filter(r=>r.kiste===k);
  if (!rows.length) return {cls:"", label:"offen"};
  const f = rows.filter(r=>r.status==="fehlt").length, m = rows.filter(r=>r.status==="mehr").length;
  if (f) return {cls:"bad", label: f+" fehlt"};
  if (m) return {cls:"more", label: m+" zu viel"};
  return {cls:"ok", label:"komplett"};
}
function lastCheck(k){ return S.meldungen.find(m=>m.kiste===k && (m.art==="kontrolle"||m.art==="lehrer")); }

function matches(){
  const trades = [], noSource = [], spare = [];
  for (const w of WERKZEUGE){
    const need = S.bestand.filter(r=>r.werkzeug===w.id && r.status==="fehlt").map(r=>r.kiste).sort((a,b)=>a-b);
    const pool = S.bestand.filter(r=>r.werkzeug===w.id && r.status==="mehr").sort((a,b)=>a.kiste-b.kiste)
      .flatMap(r=>Array(Math.max(1,r.anzahl||1)).fill(r.kiste));
    need.forEach((k,i)=>{ if (i < pool.length) trades.push({w:w.id, von:pool[i], nach:k}); else noSource.push({w:w.id, kiste:k}); });
    pool.slice(need.length).forEach(k=>spare.push({w:w.id, kiste:k}));
  }
  return {trades, noSource, spare};
}

function chronik(){
  const asc = S.meldungen.slice().sort((a,b)=>a.created_at.localeCompare(b.created_at));
  const prev = {}; const out = [];
  for (const m of asc){
    const e = {...m, neu:[], vorher:null};
    if (m.art==="kontrolle"){
      const p = prev[m.kiste];
      if (p){ e.vorher = p; e.neu = (m.fehlt||[]).filter(w => !(p.fehlt||[]).includes(w)); }
      prev[m.kiste] = m;
    } else if (m.art==="lehrer"){ prev[m.kiste] = {...m, fehlt:[]}; }
    else if (m.art==="tausch"){
      for (const k of [m.kiste, m.partner]) if (prev[k]) prev[k] = {...prev[k], fehlt:(prev[k].fehlt||[]).filter(w=> !(k===m.kiste && w===m.werkzeug))};
    }
    out.push(e);
  }
  return out.reverse();
}
function evHtml(e){
  if (e.art==="tausch") return `<div class="ev"><div class="kno"><small>Kiste</small>${e.kiste}</div><div class="body">
    <span class="when">${fmt(e.created_at)} · Tausch · ${esc(e.klasse)}</span><span>${esc(WNAME(e.werkzeug))} von Kiste ${e.partner} erhalten</span></div></div>`;
  if (e.art==="lehrer") return `<div class="ev"><div class="kno"><small>Kiste</small>${e.kiste}</div><div class="body">
    <span class="when">${fmt(e.created_at)} · Lehrkraft</span><span>Kiste als vollständig gesetzt</span></div></div>`;
  const f = e.fehlt||[], m = e.mehr||[];
  return `<div class="ev ${e.neu.length?"alarm":""}"><div class="kno"><small>Kiste</small>${e.kiste}</div><div class="body">
    <span class="when">${fmt(e.created_at)} · ${esc(e.klasse)} · ${esc(PHASE[e.phase]||e.phase)}</span>
    <div class="sumlist">${!f.length&&!m.length?`<span class="chip ok">vollständig</span>`:""}
      ${f.map(w=>`<span class="chip bad">${e.neu.includes(w)?"neu ":""}fehlt: ${esc(WNAME(w))}</span>`).join("")}
      ${m.map(x=>`<span class="chip more">${x.n}× zu viel: ${esc(WNAME(x.w))}</span>`).join("")}</div>
    ${e.neu.length && e.vorher ? `<div class="between">Verschwunden zwischen <b>${esc(e.vorher.klasse)}, ${esc(PHASE[e.vorher.phase]||e.vorher.phase)} (${fmtDay(e.vorher.created_at)})</b> und <b>${esc(e.klasse)}, ${esc(PHASE[e.phase]||e.phase)} (${fmtDay(e.created_at)})</b>.</div>`:""}
  </div></div>`;
}

/* ---------- Druckbögen ---------- */
function baseUrl(){
  if (CONFIG.BASIS_URL) return CONFIG.BASIS_URL.replace(/#.*$/,"");
  return location.href.replace(/#.*$/,"");
}
function qrSvg(text){
  try{ const q = qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:0, scalable:true}); }
  catch(e){ return `<p style="font-size:9px;word-break:break-all">${esc(text)}</p>`; }
}
function renderDruck(){
  app.className = "wrap wide";
  const blobs = ["#8db4e6","#c9dcf3","#5d8fd0"];
  app.innerHTML = `<div class="noprint" style="display:flex;flex-direction:column;gap:16px">${topbar(true)}
    <section class="glass hero"><h1>Kistenlisten zum Laminieren</h1>
      <p class="muted">Ein DIN-A4-Bogen pro Kiste. Der QR-Code öffnet direkt die Kontrolle der jeweiligen Kiste.</p>
      ${DEMO?`<p class="muted" style="font-size:.88rem">Die QR-Codes zeigen auf die Adresse dieser Seite. Trag vor dem Drucken unter BASIS_URL die GitHub-Adresse ein.</p>`
            :`<div class="row"><button class="btn" id="print">Alle Bögen drucken</button></div>`}</section></div>
    <div class="sheets">${KISTEN.map((k,i)=>{ const url = baseUrl()+"#kiste-"+k;
      return `<article class="sheet">
        <i class="sb" style="width:70mm;height:70mm;background:${blobs[i%3]};top:-20mm;right:-15mm"></i>
        <i class="sb" style="width:60mm;height:60mm;background:${blobs[(i+1)%3]};bottom:-15mm;left:-15mm"></i>
        <div class="sheet-h"><div>${logo("18mm")}<div class="sub" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">BS1 Bayreuth · Spengler</div>
          <div class="big">Werkzeugkiste ${k}</div>
          <div class="sub" style="margin-top:2mm">Zuständig: Nr. ${k} der MKP11 · Nr. ${k} der MKP12</div></div>
          <div class="qr">${qrSvg(url)}</div></div>
        <div class="steps"><div><b>1</b>QR-Code scannen</div><div><b>2</b>Klasse und Kontrolle wählen</div><div><b>3</b>Jedes Werkzeug prüfen</div><div><b>4</b>Absenden. Montag und Freitag!</div></div>
        <div class="slist">${WERKZEUGE.map(w=>`<div><span class="sn">${w.id}</span><span class="sp">${ICONS[w.icon]}<img src="${IMG[String(w.id).padStart(2,"0")]||""}" alt="" onload="this.parentNode.classList.add('foto')" onerror="this.remove()"></span><span>${esc(w.name)}${w.zusatz?" "+w.zusatz:""}</span></div>`).join("")}</div>
        <div class="sheet-f"><span>Fehlt etwas? Live-Hinweis in der App zeigt, wo es liegt.</span><span>Kiste ${k} / ${KISTEN.length}</span></div>
      </article>`; }).join("")}</div>`;
  const p = $("#print"); if (p) p.onclick = () => window.print();
}

let timer = null;
async function refresh(){
  try{ const d = await store.load(); S.bestand = d.bestand; S.meldungen = d.meldungen; S.loaded = true; S.error = null; }
  catch(e){ S.error = e; }
  update();
}
function update(){
  const r = route();
  if (r.view==="kiste" && form && form.kiste===r.k && $("#live")) { renderLive(); return; }  // Formular nicht zurücksetzen
  if (r.view==="druck" && $(".sheets")) return;
  draw();
}
function draw(){
  const r = route();
  if (S.error && !S.loaded){ app.className="wrap"; app.innerHTML = `${topbar(false)}<div class="err">Keine Verbindung zur Datenbank. Prüfe das WLAN und lade die Seite neu.</div>`; return; }
  if (r.view==="kiste") renderKiste(r.k);
  else if (r.view==="lehrer") renderLehrer();
  else if (r.view==="druck") renderDruck();
  else renderStart();
}
window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if (h !== CUR){ CUR = h; draw(); window.scrollTo(0,0); } });
store.subscribe(() => { clearTimeout(timer); timer = setTimeout(refresh, 250); });
setInterval(refresh, 60000);   // Sicherheitsnetz, falls die Live-Verbindung abreißt
refresh();
</script>
